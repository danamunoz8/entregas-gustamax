<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Entregas del Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await(a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({key:"AIzaSyATn4VTX2_T-s_JVkEPA-rGvM0E5tK9HE8",v:"weekly",language:"es"});</script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #f5f5f5;
    color: #111111;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 96px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .header {
    background: #ffffff;
    padding: 20px 20px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #f0f0f0;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .conductor-label {
    font-size: 12px;
    color: #9ca3af;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }

  .conductor-nombre {
    font-size: 20px;
    font-weight: 700;
    color: #111111;
    line-height: 1.2;
  }

  .fecha-badge {
    font-size: 13px;
    font-weight: 500;
    color: #6b7280;
    background: #f5f5f5;
    padding: 6px 12px;
    border-radius: 20px;
  }

  /* ── PROGRESS ── */
  .progress-section {
    padding-bottom: 16px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .progress-label {
    font-size: 13px;
    color: #6b7280;
    font-weight: 400;
  }

  .progress-count {
    font-size: 13px;
    font-weight: 600;
    color: #111111;
  }

  .progress-bar {
    height: 4px;
    background: #e5e7eb;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: #22c55e;
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  /* ── STATS ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 16px 16px 8px;
  }

  .stat-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .stat-num {
    font-size: 22px;
    font-weight: 700;
    color: #111111;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-num.verde { color: #22c55e; }
  .stat-num.naranja { color: #f59e0b; }

  .stat-label {
    font-size: 11px;
    color: #9ca3af;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ── SECTION TITLE ── */
  .section-title {
    padding: 16px 16px 8px;
    font-size: 12px;
    font-weight: 600;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  /* ── PARADA CARD ── */
  .parada {
    margin: 0 16px 10px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    overflow: hidden;
    border-left: 4px solid transparent;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .parada.activa {
    border-left-color: #111111;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  }

  .parada.entregada {
    border-left-color: #22c55e;
    opacity: 0.6;
  }

  .parada-inner {
    padding: 16px;
  }

  /* ── BADGE SIGUIENTE ── */
  .badge-siguiente {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #111111;
    color: #ffffff;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #22c55e;
    animation: blink 1.4s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ── INFO PARADA ── */
  .parada-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }

  .parada-num-label {
    font-size: 11px;
    font-weight: 500;
    color: #9ca3af;
  }

  .zona-pill {
    font-size: 11px;
    font-weight: 500;
    color: #6b7280;
    background: #f5f5f5;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .parada-nombre {
    font-size: 17px;
    font-weight: 700;
    color: #111111;
    line-height: 1.3;
    margin-bottom: 4px;
  }

  .parada.entregada .parada-nombre {
    color: #6b7280;
    text-decoration: line-through;
  }

  .parada-dir {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 12px;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 4px;
  }

  .parada-dir-icon {
    flex-shrink: 0;
    margin-top: 1px;
    color: #9ca3af;
  }

  /* ── PRODUCTO TAGS ── */
  .parada-productos {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }

  .producto-tag {
    font-size: 12px;
    font-weight: 500;
    color: #374151;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    padding: 4px 10px;
    border-radius: 6px;
  }

  /* ── BOTONES ── */
  .btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn {
    min-height: 52px;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: opacity 0.15s ease, transform 0.1s ease;
    letter-spacing: -0.01em;
  }

  .btn:active {
    transform: scale(0.97);
    opacity: 0.85;
  }

  .btn-navegar {
    background: #1a1a1a;
    color: #ffffff;
  }

  .btn-entregar {
    background: #22c55e;
    color: #ffffff;
  }

  .btn-entregar:disabled {
    background: #d1fae5;
    color: #86efac;
    cursor: not-allowed;
  }

  .btn-entregar:disabled:active {
    transform: none;
    opacity: 1;
  }

  /* ── ESTADO ENTREGADA ── */
  .check-estado {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #22c55e;
    font-size: 14px;
    font-weight: 600;
  }

  .check-icon {
    width: 24px;
    height: 24px;
    background: #dcfce7;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .check-hora {
    font-size: 12px;
    color: #9ca3af;
    font-weight: 400;
    margin-left: 2px;
  }

  /* ── DIVIDER ── */
  .section-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px 4px;
    font-size: 12px;
    font-weight: 600;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e5e7eb;
  }

  /* ── BANNER COMPLETADO ── */
  .banner-done {
    display: none;
    margin: 8px 16px 4px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }

  .banner-done.show { display: block; }

  .banner-done-icon {
    font-size: 32px;
    margin-bottom: 8px;
    display: block;
  }

  .banner-done h2 {
    font-size: 18px;
    font-weight: 700;
    color: #15803d;
    margin-bottom: 4px;
  }

  .banner-done p {
    font-size: 13px;
    color: #4ade80;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 108px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: #111111;
    color: #ffffff;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 30px;
    opacity: 0;
    transition: all 0.25s ease;
    z-index: 999;
    white-space: nowrap;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toast-check {
    width: 18px;
    height: 18px;
    background: #22c55e;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-top: 1px solid #f0f0f0;
    padding: 14px 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .bottom-proxima {
    min-width: 0;
    flex: 1;
  }

  .bottom-proxima-label {
    font-size: 11px;
    color: #9ca3af;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }

  .bottom-proxima-val {
    font-size: 15px;
    font-weight: 700;
    color: #111111;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── ERROR STATE ── */
  .error-state {
    margin: 24px 16px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 12px;
    padding: 20px;
    font-size: 14px;
    color: #9a3412;
    line-height: 1.6;
  }

  .error-state strong {
    display: block;
    font-size: 15px;
    margin-bottom: 6px;
  }

  /* ── MAPA ── */
  .mapa-wrap {
    margin: 0 16px 16px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    background: #e5e7eb;
  }

  #mapa {
    height: 220px;
    width: 100%;
    display: none;
  }

  .mapa-loading {
    height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #9ca3af;
    font-size: 13px;
  }

  .mapa-loading-spinner {
    width: 24px;
    height: 24px;
    border: 2px solid #e5e7eb;
    border-top-color: #9ca3af;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── DRAG AND DROP ── */
  .parada[draggable="true"] { cursor: grab; }
  .parada[draggable="true"]:active { cursor: grabbing; }

  .parada.dragging {
    opacity: 0.3;
    border-left-color: #d1d5db !important;
    box-shadow: none !important;
  }

  .parada.drag-over-top {
    box-shadow: 0 -3px 0 0 #111111, 0 1px 4px rgba(0,0,0,0.08) !important;
  }

  .parada.drag-over-bottom {
    box-shadow: 0 3px 0 0 #111111, 0 1px 4px rgba(0,0,0,0.08) !important;
  }

  .drag-handle {
    color: #d1d5db;
    cursor: grab;
    line-height: 0;
    padding: 2px 0 2px 6px;
    flex-shrink: 0;
  }

  /* ── SKELETON LOADER ── */
  .skeleton {
    margin: 0 16px 10px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 16px;
    border-left: 4px solid #f0f0f0;
  }

  .skel-line {
    background: #f0f0f0;
    border-radius: 4px;
    animation: shimmer 1.4s ease infinite;
  }

  @keyframes shimmer {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="conductor-info">
      <div class="conductor-label">Conductor</div>
      <div class="conductor-nombre" id="conductor-nombre">Cargando...</div>
    </div>
    <div class="fecha-badge" id="fecha-badge">—</div>
  </div>
  <div class="progress-section">
    <div class="progress-meta">
      <span class="progress-label">Progreso del día</span>
      <span class="progress-count"><span id="count-done">0</span> de <span id="count-total">0</span> entregas</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-card">
    <div class="stat-num" id="stat-pend">—</div>
    <div class="stat-label">Pendientes</div>
  </div>
  <div class="stat-card">
    <div class="stat-num verde" id="stat-done">0</div>
    <div class="stat-label">Entregados</div>
  </div>
  <div class="stat-card">
    <div class="stat-num naranja" id="stat-hora" style="font-size:17px">--:--</div>
    <div class="stat-label">Última hora</div>
  </div>
</div>

<!-- MAPA -->
<div class="mapa-wrap">
  <div class="mapa-loading" id="mapa-loading">
    <div class="mapa-loading-spinner"></div>
    Cargando mapa de ruta...
  </div>
  <div id="mapa"></div>
</div>

<!-- BANNER COMPLETADO -->
<div class="banner-done" id="banner-done">
  <span class="banner-done-icon">🎉</span>
  <h2>¡Ruta completada!</h2>
  <p id="banner-texto">Todas las entregas del día confirmadas.</p>
</div>

<!-- LISTA PENDIENTES -->
<div class="section-title" id="title-pendientes">Ruta de hoy</div>
<div id="lista-paradas">
  <div class="skeleton">
    <div class="skel-line" style="width:40%;height:10px;margin-bottom:10px;"></div>
    <div class="skel-line" style="width:75%;height:16px;margin-bottom:8px;"></div>
    <div class="skel-line" style="width:60%;height:12px;margin-bottom:16px;"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div class="skel-line" style="height:52px;border-radius:10px;"></div>
      <div class="skel-line" style="height:52px;border-radius:10px;"></div>
    </div>
  </div>
</div>

<!-- LISTA ENTREGADAS -->
<div class="section-divider" id="div-entregadas" style="display:none">Entregadas</div>
<div id="lista-entregadas"></div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span class="toast-check">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
      <path d="M2 5l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  Entrega registrada
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="bottom-proxima">
    <div class="bottom-proxima-label">Próxima parada</div>
    <div class="bottom-proxima-val" id="nav-proxima">Cargando...</div>
  </div>
</div>

<script>
let PARADAS = [];
let entregadas = new Set();
let horasEntrega = {};

function horaActual() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function renderFecha() {
  const d = new Date();
  const dias = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  document.getElementById('fecha-badge').textContent =
    `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}`;
}

function renderProgreso() {
  const total = PARADAS.length;
  const done = entregadas.size;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('count-done').textContent = done;
  document.getElementById('count-total').textContent = total;
  document.getElementById('stat-pend').textContent = total - done;
  document.getElementById('stat-done').textContent = done;

  const pendientes = PARADAS.filter(p => !entregadas.has(p._id));
  document.getElementById('nav-proxima').textContent =
    pendientes.length > 0 ? pendientes[0].cliente : "¡Completado!";

  if (total > 0 && done === total) {
    document.getElementById('banner-done').classList.add('show');
    document.getElementById('banner-texto').textContent =
      `¡Terminaste a las ${horaActual()}! Todas las entregas confirmadas.`;
    document.getElementById('title-pendientes').style.display = 'none';
  }
}

function renderParada(p) {
  const displayNum = PARADAS.findIndex(x => x._id === p._id) + 1;
  const esPrimera = !entregadas.has(p._id) &&
    PARADAS.filter(x => !entregadas.has(x._id))[0]?._id === p._id;
  const entregada = entregadas.has(p._id);
  const hora = horasEntrega[p._id] || '';
  const draggable = !entregada;

  const notasHtml = p.notas
    ? `<div class="producto-tag" style="color:#d97706;border-color:#fde68a;background:#fffbeb;">⚠️ ${p.notas}</div>`
    : '';

  const handleHtml = draggable
    ? `<span class="drag-handle" title="Arrastrar para reordenar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="4" y="4" width="8" height="1.5" rx="0.75" fill="currentColor"/>
          <rect x="4" y="7.25" width="8" height="1.5" rx="0.75" fill="currentColor"/>
          <rect x="4" y="10.5" width="8" height="1.5" rx="0.75" fill="currentColor"/>
        </svg>
      </span>`
    : '';

  const accionHtml = entregada
    ? `<div class="check-estado">
        <span class="check-icon">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 6l2.5 2.5 4.5-4.5" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Entregado
        <span class="check-hora">a las ${hora}</span>
      </div>`
    : `<div class="btns">
        <button class="btn btn-navegar" onclick="navegar('${p.maps}')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 1.5C5.51 1.5 3.5 3.51 3.5 6c0 3.75 4.5 8.5 4.5 8.5s4.5-4.75 4.5-8.5c0-2.49-2.01-4.5-4.5-4.5z" stroke="white" stroke-width="1.3" stroke-linejoin="round"/>
            <circle cx="8" cy="6" r="1.5" fill="white"/>
          </svg>
          Navegar
        </button>
        <button class="btn btn-entregar" onclick="marcarEntregado('${p._id}')" ${!esPrimera ? 'disabled' : ''}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8l3.5 3.5 6.5-6.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Entregado
        </button>
      </div>`;

  return `
  <div class="parada ${esPrimera ? 'activa' : ''} ${entregada ? 'entregada' : ''}"
       id="parada-${p._id}" data-id="${p._id}" ${draggable ? 'draggable="true"' : ''}>
    <div class="parada-inner">
      ${esPrimera ? `<div class="badge-siguiente"><span class="badge-dot"></span>Siguiente</div>` : ''}
      <div class="parada-top">
        <span class="parada-num-label">Parada ${displayNum} de ${PARADAS.length}</span>
        ${handleHtml}
      </div>
      <div class="parada-nombre">${p.cliente}</div>
      <div class="parada-dir">
        <svg class="parada-dir-icon" width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M6.5 1C4.57 1 3 2.57 3 4.5c0 2.8 3.5 7.5 3.5 7.5S10 7.3 10 4.5C10 2.57 8.43 1 6.5 1z" stroke="#9ca3af" stroke-width="1.1" stroke-linejoin="round"/>
          <circle cx="6.5" cy="4.5" r="1.2" fill="#9ca3af"/>
        </svg>
        ${p.direccion}
      </div>
      ${notasHtml ? `<div class="parada-productos">${notasHtml}</div>` : ''}
      ${accionHtml}
    </div>
  </div>`;
}

function renderLista() {
  const pendientes = PARADAS.filter(p => !entregadas.has(p._id));
  const hechas = PARADAS.filter(p => entregadas.has(p._id)).reverse();

  document.getElementById('lista-paradas').innerHTML =
    pendientes.map(renderParada).join('');

  const divEnt = document.getElementById('div-entregadas');
  if (hechas.length > 0) {
    divEnt.style.display = 'flex';
    document.getElementById('lista-entregadas').innerHTML =
      hechas.map(renderParada).join('');
  } else {
    divEnt.style.display = 'none';
    document.getElementById('lista-entregadas').innerHTML = '';
  }

  renderProgreso();
  attachDragEvents();
}

function navegar(url) {
  window.open(url, '_blank');
}

function marcarEntregado(id) {
  const hora = horaActual();
  entregadas.add(id);
  horasEntrega[id] = hora;
  document.getElementById('stat-hora').textContent = hora;

  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);

  renderLista();
  actualizarMarkers();

  setTimeout(() => {
    const siguiente = PARADAS.find(p => !entregadas.has(p._id));
    if (siguiente) {
      const el = document.getElementById(`parada-${siguiente._id}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }, 300);
}

// ── MAPA ──
let gmap = null;
let gmarkers = {};   // _id -> Marker
let routeLine = null;

function getCachedCoords() {
  try { return JSON.parse(localStorage.getItem('entregas-coords') || '{}'); }
  catch { return {}; }
}
function saveCachedCoords(obj) {
  localStorage.setItem('entregas-coords', JSON.stringify(obj));
}

async function initMap() {
  try {
    const { Map }      = await google.maps.importLibrary('maps');
    const { Geocoder } = await google.maps.importLibrary('geocoding');

    document.getElementById('mapa-loading').style.display = 'none';
    const mapaEl = document.getElementById('mapa');
    mapaEl.style.display = 'block';

    gmap = new Map(mapaEl, {
      zoom: 12,
      center: { lat: 4.711, lng: -74.0721 },
      mapTypeControl: false,
      streetViewControl: false,
      fullscreenControl: false,
      zoomControlOptions: { position: 7 }, // RIGHT_TOP
    });

    const geocoder = new Geocoder();
    const cached   = getCachedCoords();
    const bounds   = new google.maps.LatLngBounds();
    const pathCoords = [];

    // Geocodificar en paralelo
    const results = await Promise.all(
      PARADAS.map(p =>
        cached[p._id]
          ? Promise.resolve({ p, pos: cached[p._id] })
          : geocoder.geocode({ address: p.direccion + ', Bogotá, Colombia' })
              .then(r => {
                const loc = r.results[0]?.geometry.location;
                const pos = loc ? { lat: loc.lat(), lng: loc.lng() } : null;
                if (pos) cached[p._id] = pos;
                return { p, pos };
              })
              .catch(() => ({ p, pos: null }))
      )
    );

    saveCachedCoords(cached);

    results.forEach(({ p, pos }, i) => {
      if (!pos) return;
      bounds.extend(pos);
      pathCoords.push(pos);
      colocarMarker(p, pos, i + 1);
    });

    if (routeLine) routeLine.setMap(null);
    routeLine = new google.maps.Polyline({
      path: pathCoords,
      geodesic: true,
      strokeColor: '#111111',
      strokeOpacity: 0.18,
      strokeWeight: 2,
      map: gmap,
    });

    if (pathCoords.length > 0) gmap.fitBounds(bounds, { padding: 32 });

  } catch (err) {
    console.warn('Maps no disponible:', err);
    document.getElementById('mapa-loading').textContent = 'Mapa no disponible';
  }
}

function iconSvg(num, delivered, isNext) {
  const color = delivered ? '#22c55e' : isNext ? '#111111' : '#4b5563';
  const r     = isNext ? 16 : 13;
  const size  = r * 2;
  const fs    = isNext ? 13 : 11;
  const svg   = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">
    <circle cx="${r}" cy="${r}" r="${r}" fill="${color}"/>
    <text x="${r}" y="${r+1}" text-anchor="middle" dominant-baseline="middle"
      fill="white" font-family="Inter,sans-serif" font-size="${fs}" font-weight="700">${num}</text>
  </svg>`;
  return {
    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
    scaledSize: new google.maps.Size(size, size),
    anchor: new google.maps.Point(r, r),
  };
}

function colocarMarker(p, pos, num) {
  if (gmarkers[p._id]) gmarkers[p._id].setMap(null);
  const delivered = entregadas.has(p._id);
  const isNext    = !delivered && PARADAS.filter(x => !entregadas.has(x._id))[0]?._id === p._id;
  gmarkers[p._id] = new google.maps.Marker({
    position: pos,
    map: gmap,
    icon: iconSvg(num, delivered, isNext),
    title: p.cliente,
    zIndex: isNext ? 100 : delivered ? 1 : 10,
  });
}

function actualizarMarkers() {
  if (!gmap) return;
  PARADAS.forEach((p, i) => {
    const marker = gmarkers[p._id];
    if (!marker) return;
    const delivered = entregadas.has(p._id);
    const isNext    = !delivered && PARADAS.filter(x => !entregadas.has(x._id))[0]?._id === p._id;
    marker.setIcon(iconSvg(i + 1, delivered, isNext));
    marker.setZIndex(isNext ? 100 : delivered ? 1 : 10);
  });
}

function mostrarError(msg) {
  document.getElementById('lista-paradas').innerHTML =
    `<div class="error-state"><strong>No se pudieron cargar las entregas</strong>${msg}</div>`;
  document.getElementById('nav-proxima').textContent = 'Error al cargar';
}

// ── LOCALSTORAGE ──
function saveOrder() {
  localStorage.setItem('entregas-order', JSON.stringify(PARADAS.map(p => p._id)));
}

function restoreOrder(paradas) {
  try {
    const saved = localStorage.getItem('entregas-order');
    if (!saved) return paradas;
    const order = JSON.parse(saved);
    const map = new Map(paradas.map(p => [p._id, p]));
    const restored = order.map(id => map.get(id)).filter(Boolean);
    // agregar paradas nuevas que no estaban guardadas
    const savedSet = new Set(order);
    paradas.forEach(p => { if (!savedSet.has(p._id)) restored.push(p); });
    return restored;
  } catch {
    return paradas;
  }
}

// ── DRAG AND DROP ──
let draggedId  = null;
let dropTarget = null;
let dropBefore = true;
let dragEventsAttached = false;

// Se llama una sola vez — los listeners viven en el contenedor que nunca se reemplaza
function attachDragEvents() {
  if (dragEventsAttached) return;
  dragEventsAttached = true;

  const lista = document.getElementById('lista-paradas');
  lista.addEventListener('dragstart', onDragStart);
  lista.addEventListener('dragover',  onDragOver);
  lista.addEventListener('dragleave', onDragLeave);
  lista.addEventListener('drop',      onDrop);
  lista.addEventListener('dragend',   onDragEnd);
}

function onDragStart(e) {
  const card = e.target.closest('[draggable="true"]');
  if (!card) return;
  draggedId = card.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', draggedId); // requerido por Chrome y Safari
  setTimeout(() => card.classList.add('dragging'), 0);
}

function onDragOver(e) {
  e.preventDefault();
  const card = e.target.closest('[draggable="true"]');
  if (!card || card.dataset.id === draggedId) return;

  clearDropIndicators();
  const rect = card.getBoundingClientRect();
  dropBefore = e.clientY < rect.top + rect.height / 2;
  card.classList.add(dropBefore ? 'drag-over-top' : 'drag-over-bottom');
  dropTarget = card.dataset.id;
  e.dataTransfer.dropEffect = 'move';
}

function onDragLeave(e) {
  const card = e.target.closest('.parada');
  // relatedTarget puede ser null si el cursor sale de la ventana
  if (card && !card.contains(e.relatedTarget || null)) {
    card.classList.remove('drag-over-top', 'drag-over-bottom');
  }
}

function onDrop(e) {
  e.preventDefault();
  if (!draggedId || !dropTarget || draggedId === dropTarget) return;

  const fromIdx = PARADAS.findIndex(p => p._id === draggedId);
  if (fromIdx === -1) return;

  const [moved] = PARADAS.splice(fromIdx, 1);

  // recalcular toIdx después del splice porque los índices se desplazan
  const toIdx = PARADAS.findIndex(p => p._id === dropTarget);
  if (toIdx === -1) { PARADAS.splice(fromIdx, 0, moved); return; }

  PARADAS.splice(dropBefore ? toIdx : toIdx + 1, 0, moved);

  saveOrder();
  renderLista();
}

function onDragEnd() {
  clearDropIndicators();
  document.querySelectorAll('.parada.dragging').forEach(c => c.classList.remove('dragging'));
  draggedId = null;
  dropTarget = null;
}

function clearDropIndicators() {
  document.querySelectorAll('.parada').forEach(c =>
    c.classList.remove('drag-over-top', 'drag-over-bottom')
  );
}

document.addEventListener('DOMContentLoaded', () => {
  renderFecha();

  fetch('/entregas.json')
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then(data => {
      // asignar _id estable basado en la posicion original del JSON
      const paradas = data.paradas.map(p => ({ ...p, _id: String(p.posicion) }));
      PARADAS = restoreOrder(paradas);
      if (data.conductor) {
        document.getElementById('conductor-nombre').textContent = data.conductor;
      }
      renderLista();
      initMap();
    })
    .catch(err => {
      console.error('Error cargando entregas.json:', err);
      mostrarError(`Error: ${err.message}`);
    });
});
</script>
